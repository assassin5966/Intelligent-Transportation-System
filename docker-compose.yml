# ============================================================
# 智慧古城车辆人流监管平台 - 容器编排
# 架构: AI 分析服务 / 业务后端 (同一镜像) + Redis
#
# 启动 (离线一键拉起 前端 + 后端 + AI + Redis/MySQL):
#   docker compose up -d                # 直接使用预构建镜像(dt-frontend:latest 等)启动, 离线下用这个
#   前端为预构建镜像, 不在本机 build(需联网拉 npm 依赖, 离线会失败); 瓦片走宿主机挂载, 替换即可
#   启用 GPU: 取消下方 ai 服务 deploy 注释后 docker compose up -d
# ============================================================

services:
  # ---------- AI 分析服务 (YOLO11/ByteTrack/越线计数) ----------
  ai:
    build: .
    image: smart-city-platform:latest
    restart: unless-stopped
    command: ["python", "-m", "app.ai.service"]
    ports:
      - "8001:8001"
    environment:
      - REDIS_URL=redis://redis:6379/0
      - BACKEND_URL=http://backend:8000
      - PYTHONUNBUFFERED=1
    volumes:
      - ./app:/app/app:cached
      - ./models:/app/models:cached
      - ./configs:/app/configs:cached
      - ./logs:/app/logs
      - model-cache:/root/.cache
    depends_on:
      - redis
    # 挂共享网, 供 AI 按服务名访问外部 ZLM(zlmediakit) 拉 HTTP-FLV
    networks:
      - default
      - wvp-shared
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: [gpu]

  # ---------- 业务后端 (FastAPI: 实时统计/告警/REST API/预测) ----------
  backend:
    image: smart-city-platform:latest
    restart: unless-stopped
    command: ["uvicorn", "app.backend.main:app", "--host", "0.0.0.0", "--port", "8000"]
    ports:
      - "8000:8000"
    environment:
      - REDIS_URL=redis://redis:6379/0
      - AI_SERVICE_URL=http://ai:8001
      - PYTHONUNBUFFERED=1
      # WVP-GB28181 对接 (WVP/ZLM 已外部部署; 启用需 WVP_ENABLED=true 且 WVP_API_URL 指向外部 WVP)
      - WVP_ENABLED=${WVP_ENABLED:-false}
      - WVP_API_URL=${WVP_API_URL:-http://wvp:18080}
      - WVP_USERNAME=${WVP_USERNAME:-admin}
      - WVP_PASSWORD=${WVP_PASSWORD:-admin}
      - WVP_SYNC_INTERVAL=${WVP_SYNC_INTERVAL:-30}
      - WVP_PLAY_PROTOCOL=${WVP_PLAY_PROTOCOL:-flv}
      - WVP_STREAM_SUB=${WVP_STREAM_SUB:-true}
      # 前端播放地址翻译 (/api/devices/glm-5.3_common/play); 空值走自动推导/原样返回
      - ZLM_PUBLIC_BASE=${ZLM_PUBLIC_BASE:-}
      - MEDIAMTX_PUBLIC_BASE=${MEDIAMTX_PUBLIC_BASE:-}
      # MySQL 长期归档 (小时级车流/人流量落库, 长期报表); MYSQL_ENABLED=false 则跳过
      - MYSQL_ENABLED=${MYSQL_ENABLED:-true}
      - MYSQL_HOST=${MYSQL_HOST:-mysql}
      - MYSQL_PORT=${MYSQL_PORT:-3306}
      - MYSQL_USER=${MYSQL_USER:-root}
      - MYSQL_PASSWORD=${MYSQL_PASSWORD:-root123456}
      - MYSQL_DATABASE=${MYSQL_DATABASE:-dt_stats}
    volumes:
      - ./app:/app/app:cached
      - ./models:/app/models:cached
      - ./configs:/app/configs:cached
      - ./static:/app/static:cached
      - ./data:/app/data:cached
      - ./logs:/app/logs
    depends_on:
      - redis
      - mysql
    # 挂共享网, 供 backend 按服务名访问外部 WVP(wvp:18080)
    networks:
      - default
      - wvp-shared

  # ---------- MySQL: 长期归档 (小时级车流/人流量报表) ----------
  mysql:
    image: mysql:8.0
    container_name: dt-mysql
    restart: unless-stopped
    environment:
      - MYSQL_ROOT_PASSWORD=root123456
      - MYSQL_DATABASE=dt_stats
      - TZ=Asia/Shanghai
    command: >
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
    # 宿主机映射 3307 (宿主 3306 常被本机 MySQL 占用); 容器内仍 3306, 后端经容器内网 mysql:3306 连接
    ports:
      - "3307:3306"
    volumes:
      - mysql-data:/var/lib/mysql

  # ---------- Redis: 实时状态 (当前车辆/人员数量、告警、设备配置) ----------
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "16379:6379"
    volumes:
      - redis-data:/data

  # ---------- WVP / ZLM / MySQL: 外部已部署 (上下级级联), 不在本项目编排 ----------
  # 本项目仅作消费方: 后端调外部 WVP REST API 同步设备/取 FLV 地址; AI 拉外部 ZLM 的 HTTP-FLV
  # 对接参数见 backend 环境变量: WVP_API_URL / WVP_USERNAME / WVP_PASSWORD

  # ---------- 大屏前端 (Vue3 + Vite, nginx 托管 + 反代后端 API/WS) ----------
  # 离线部署用【预构建镜像 dt-frontend:latest】(docker load 导入)，不在本机 build，
  # 故 docker compose up -d 即可一键拉起，不需要 --build (build 需联网拉 npm 依赖, 离线会失败)。
  # 前端产物(js/css/html)在镜像内; 瓦片不走镜像，而是【挂载宿主机 ./map-marking-system-vue/public/tiles】到
  #  nginx 的 /var/www/tiles, 替换瓦片只需改宿主机目录, 无需重建镜像。
  # 访问: http://localhost:5173  (nginx 内 80, 宿主机映射 5173 与 dev 端口一致)
  # 仅改 nginx.conf / 瓦片: 宿主机改后 docker exec dt-frontend nginx -s reload
  frontend:
    image: dt-frontend:latest
    container_name: dt-frontend
    restart: unless-stopped
    ports:
      - "5173:80"
    volumes:
      - ./map-marking-system-vue/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./map-marking-system-vue/public/tiles:/var/www/tiles:ro
    depends_on:
      - backend

volumes:
  redis-data:
  model-cache:
  mysql-data:

networks:
  default:
    name: dt_default
  # 引用 setting/ 创建的共享网络(先启动 setting 再启动本项目)
  wvp-shared:
    external: true
    name: wvp-shared
