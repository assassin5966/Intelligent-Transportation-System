# ============================================================
# 智慧古城车辆人流监管平台 - 容器编排
# 架构: AI 分析服务 / 业务后端 (同一镜像) + Redis
#
# 启动:
#   docker compose up -d                # CPU 模式
#   启用 GPU: 取消下方 ai 服务 deploy 注释后 docker compose up -d
# ============================================================

services:
  # ---------- AI 分析服务 (YOLO11/ByteTrack/越线计数) ----------
  ai:
    build: .
    image: smart-city-platform:latest
    restart: unless-stopped
    command: ["python", "-m", "app.ai.service"]
    ports:
      - "8001:8001"
    environment:
      - REDIS_URL=redis://redis:6379/0
      - BACKEND_URL=http://backend:8000
      - PYTHONUNBUFFERED=1
    volumes:
      - ./app:/app/app:cached
      - ./models:/app/models:cached
      - ./configs:/app/configs:cached
      - ./logs:/app/logs
      - model-cache:/root/.cache
    depends_on:
      - redis
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: [gpu]

  # ---------- 业务后端 (FastAPI: 实时统计/告警/REST API/预测) ----------
  backend:
    image: smart-city-platform:latest
    restart: unless-stopped
    command: ["uvicorn", "app.backend.main:app", "--host", "0.0.0.0", "--port", "8000"]
    ports:
      - "8000:8000"
    environment:
      - REDIS_URL=redis://redis:6379/0
      - AI_SERVICE_URL=http://ai:8001
      - PYTHONUNBUFFERED=1
    volumes:
      - ./app:/app/app:cached
      - ./models:/app/models:cached
      - ./configs:/app/configs:cached
      - ./logs:/app/logs
    depends_on:
      - redis

  # ---------- Redis: 实时状态 (当前车辆/人员数量、告警、设备配置) ----------
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "16379:6379"
    volumes:
      - redis-data:/data

  # ---------- 视频处理器 (本地测试用) ----------
  ai-processor:
    image: smart-city-platform:latest
    container_name: traffic-ai-processor
    volumes:
      - ./output:/data/video:ro
      - ./output:/data/output
      - ./models:/app/models:ro
      - ./tool:/app/tool:ro
      - ./app:/app/app:ro
    environment:
      - PYTHONPATH=/app
    command: >
      python /app/tool/video_processor.py
      --video /data/video/test_50f.mp4
      --output /data/output
      --camera_id CAM001
      --frame_skip 5

volumes:
  redis-data:
  model-cache:
