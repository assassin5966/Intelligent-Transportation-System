# ============================================================
# 智慧古城车辆人流监管平台 - 容器编排
# 架构: AI 分析服务 / 业务后端 (同一镜像) + Redis
#
# 启动:
#   docker compose up -d                # CPU 模式
#   启用 GPU: 取消下方 ai 服务 deploy 注释后 docker compose up -d
# ============================================================

services:
  # ---------- AI 分析服务 (YOLO11/ByteTrack/越线计数) ----------
  ai:
    build: .
    image: smart-city-platform:latest
    restart: unless-stopped
    command: ["python", "-m", "app.ai.service"]
    ports:
      - "8001:8001"
    environment:
      - REDIS_URL=redis://redis:6379/0
      - BACKEND_URL=http://backend:8000
      - PYTHONUNBUFFERED=1
    volumes:
      - ./app:/app/app:cached
      - ./models:/app/models:cached
      - ./configs:/app/configs:cached
      - ./logs:/app/logs
      - model-cache:/root/.cache
    depends_on:
      - redis
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: [gpu]

  # ---------- 业务后端 (FastAPI: 实时统计/告警/REST API/预测) ----------
  backend:
    image: smart-city-platform:latest
    restart: unless-stopped
    command: ["uvicorn", "app.backend.main:app", "--host", "0.0.0.0", "--port", "8000"]
    ports:
      - "8000:8000"
    environment:
      - REDIS_URL=redis://redis:6379/0
      - AI_SERVICE_URL=http://ai:8001
      - PYTHONUNBUFFERED=1
      # WVP-GB28181 对接 (WVP/ZLM 已外部部署; 启用需 WVP_ENABLED=true 且 WVP_API_URL 指向外部 WVP)
      - WVP_ENABLED=${WVP_ENABLED:-false}
      - WVP_API_URL=${WVP_API_URL:-http://wvp:18080}
      - WVP_USERNAME=${WVP_USERNAME:-admin}
      - WVP_PASSWORD=${WVP_PASSWORD:-admin}
      - WVP_SYNC_INTERVAL=${WVP_SYNC_INTERVAL:-30}
      - WVP_PLAY_PROTOCOL=${WVP_PLAY_PROTOCOL:-flv}
      - WVP_STREAM_SUB=${WVP_STREAM_SUB:-true}
      # 前端播放地址翻译 (/api/devices/glm-5.3_common/play); 空值走自动推导/原样返回
      - ZLM_PUBLIC_BASE=${ZLM_PUBLIC_BASE:-}
      - MEDIAMTX_PUBLIC_BASE=${MEDIAMTX_PUBLIC_BASE:-}
    volumes:
      - ./app:/app/app:cached
      - ./models:/app/models:cached
      - ./configs:/app/configs:cached
      - ./static:/app/static:cached
      - ./data:/app/data:cached
      - ./logs:/app/logs
    depends_on:
      - redis

  # ---------- Redis: 实时状态 (当前车辆/人员数量、告警、设备配置) ----------
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "16379:6379"
    volumes:
      - redis-data:/data

  # ---------- WVP / ZLM / MySQL: 外部已部署 (上下级级联), 不在本项目编排 ----------
  # 本项目仅作消费方: 后端调外部 WVP REST API 同步设备/取 FLV 地址; AI 拉外部 ZLM 的 HTTP-FLV
  # 对接参数见 backend 环境变量: WVP_API_URL / WVP_USERNAME / WVP_PASSWORD

  # ---------- MediaMTX: RTSP 服务器 (测试用) ----------
  # 接收 FFmpeg 推流, AI 服务通过 RTSP 地址拉流
  # 参考: https://github.com/bluenviron/mediamtx
  rtsp-server:
    image: bluenviron/mediamtx:latest
    container_name: traffic-rtsp-server
    ports:
      - "8554:8554"    # RTSP
      - "8888:8888"    # HTTP (HLS 播放, 前端经 /play 接口拿此地址)
      # 1935 RTMP 已移除映射: 与 wvp 项目的 zlmediakit(1935) 冲突; 当前推流走 8554 RTSP 不需要 RTMP
    volumes:
      - ./data:/data/video:ro
      - ./configs/mediamtx.yml:/mediamtx.yml:ro   # 开启 HLS (默认关闭; 前端 /play 播放依赖)
    # 默认配置即可接收 publisher 模式推流

  # ---------- RTSP 推流服务 - 车辆识别 (用 FFmpeg 推送本地视频到 MediaMTX) ----------
  rtsp-streamer-vehicle:
    image: smart-city-platform:latest
    container_name: traffic-rtsp-streamer-vehicle
    depends_on:
      - rtsp-server
    volumes:
      - ./data:/data/video:ro
    environment:
      - PYTHONUNBUFFERED=1
    command: >
      ffmpeg -re -stream_loop -1 -i /data/video/车辆识别20s.mp4
      -c:v libx264 -preset ultrafast -tune zerolatency
      -f rtsp -rtsp_transport tcp rtsp://rtsp-server:8554/vehicle

  # ---------- RTSP 推流服务 - 人流识别 (用 FFmpeg 推送本地视频到 MediaMTX) ----------
  rtsp-streamer-person:
    image: smart-city-platform:latest
    container_name: traffic-rtsp-streamer-person
    depends_on:
      - rtsp-server
    volumes:
      - ./data:/data/video:ro
    environment:
      - PYTHONUNBUFFERED=1
    command: >
      ffmpeg -re -stream_loop -1 -i /data/video/人流识别20s.mp4
      -c:v libx264 -preset ultrafast -tune zerolatency
      -f rtsp -rtsp_transport tcp rtsp://rtsp-server:8554/person

  # ---------- 视频处理器 (本地测试用) ----------
  ai-processor:
    image: smart-city-platform:latest
    container_name: traffic-ai-processor
    volumes:
      - ./output:/data/video:ro
      - ./output:/data/output
      - ./models:/app/models:ro
      - ./tool:/app/tool:ro
      - ./app:/app/app:ro
    environment:
      - PYTHONPATH=/app
    command: >
      python /app/tool/video_processor.py
      --video /data/video/test_50f.mp4
      --output /data/output
      --camera_id CAM001
      --frame_skip 5

volumes:
  redis-data:
  model-cache:
