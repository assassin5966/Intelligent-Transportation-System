# ============================================================
# 离线部署专用编排 (纯镜像, 不依赖源码/网络/Python环境)
#
# 适用: 离线服务器, 用同事提供的镜像包直接加载后启动
#   镜像已在 Dockerfile 中自包含 app/configs/tool/models (含 YOLO 权重)
#   故去掉 dev 用的 ./app 等绑定挂载, 直接用镜像内置内容
#
# 用法:
#   1) 加载镜像:  docker load -i <smart-city-platform 的 tar>
#                docker load -i <redis 的 tar>
#   2) 启动:     bash scripts/start_offline.sh          (一键拉起+健康检查)
#              或 docker compose -f docker-compose.offline.yml -p smartcity up -d
#   3) 日志:     docker compose -f docker-compose.offline.yml -p smartcity logs -f backend
#   4) 停止:     bash scripts/stop_offline.sh           (stop; --down 移除容器)
#
# 说明: 环境变量从同目录 .env 读取 (没有则用默认值, 默认已指向生产机 23.45.1.115 的 WVP/ZLM)
#
# GPU 生产部署 (8x4090, CUDA 12.2):
#   1) docker load -i smart-city-platform_gpu.tar   (镜像 tag: smart-city-platform:gpu)
#   2) .env 写 PLATFORM_IMAGE=smart-city-platform:gpu
#   3) 取消下方 ai 服务 deploy 段注释 (8 卡预留), 再 compose up
# ============================================================

services:
  # ---------- AI 分析服务 (YOLO11/ByteTrack/越线计数, 端口 8001) ----------
  ai:
    image: ${PLATFORM_IMAGE:-smart-city-platform:latest}
    restart: unless-stopped
    command: ["python", "-m", "app.ai.service"]
    ports:
      - "8001:8001"
    environment:
      - REDIS_URL=redis://redis:6379/0
      - BACKEND_URL=http://backend:8000
      - PYTHONUNBUFFERED=1
      # 计数可观测性 (排查漏计/误计): 控制台日志级别 / 运行统计周期 / 逐事件明细
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - COUNT_STATS_INTERVAL=${COUNT_STATS_INTERVAL:-30}
      - COUNT_EVENT_LOG=${COUNT_EVENT_LOG:-false}
    volumes:
      - model-cache:/root/.cache
    depends_on:
      - redis
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: 8          # 8x RTX 4090; 弹性场景可改 all
    #           capabilities: [gpu]

  # ---------- 业务后端 (FastAPI, 端口 8000, WVP 唯一对接点) ----------
  backend:
    image: ${PLATFORM_IMAGE:-smart-city-platform:latest}
    restart: unless-stopped
    command: ["uvicorn", "app.backend.main:app", "--host", "0.0.0.0", "--port", "8000"]
    ports:
      - "8000:8000"
    environment:
      - REDIS_URL=redis://redis:6379/0
      - AI_SERVICE_URL=http://ai:8001
      - PYTHONUNBUFFERED=1
      - WVP_ENABLED=${WVP_ENABLED:-true}
      - WVP_API_URL=${WVP_API_URL:-http://23.45.1.115:18080}
      - WVP_USERNAME=${WVP_USERNAME:-admin}
      - WVP_PASSWORD=${WVP_PASSWORD:-admin}
      - WVP_SYNC_INTERVAL=${WVP_SYNC_INTERVAL:-30}
      - WVP_PLAY_PROTOCOL=${WVP_PLAY_PROTOCOL:-flv}
      - WVP_STREAM_SUB=${WVP_STREAM_SUB:-true}
      # 播放地址翻译: WVP 返回地址的 host 可能是 sdp-ip/容器名, 浏览器与内部取流统一重写
      # ZLM 部署在生产机 23.45.1.115 (80=HTTP-FLV 对外, 8001 区分按现场实际端口调整)
      - ZLM_PUBLIC_BASE=${ZLM_PUBLIC_BASE:-http://23.45.1.115:80}
      - ZLM_INTERNAL_BASE=${ZLM_INTERNAL_BASE:-http://23.45.1.115:80}
    depends_on:
      - redis

  # ---------- Redis (本项目事件/状态存储, 与 WVP 的 Redis 相互独立) ----------
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "16379:6379"
    volumes:
      - redis-data:/data

  # ---------- 大屏前端 (官方 nginx 基础镜像 + 宿主机挂载 dist/瓦片, 不 build) ----------
  # 前置: 宿主机准备 map-marking-system-vue/{nginx.conf,dist,public/tiles}
  #       并 docker load -i nginx_1.27-alpine.tar
  frontend:
    image: nginx:1.27-alpine
    container_name: dt-frontend
    restart: unless-stopped
    ports:
      - "5173:80"
    volumes:
      - ./map-marking-system-vue/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./map-marking-system-vue/dist:/usr/share/nginx/html:ro
      - ./map-marking-system-vue/public/tiles:/var/www/tiles:ro
    depends_on:
      - backend

volumes:
  model-cache:
  redis-data:
