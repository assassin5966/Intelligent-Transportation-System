<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>设备计数配置 - 运维工具</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: system-ui, sans-serif; background: #1a1a2e; color: #e0e0e0; padding: 20px; }
  h1 { font-size: 18px; margin-bottom: 16px; color: #8be9fd; }
  .row { display: flex; gap: 12px; margin-bottom: 16px; align-items: center; flex-wrap: wrap; }
  input, select, button {
    padding: 6px 12px; border: 1px solid #444; border-radius: 4px;
    background: #2a2a4e; color: #e0e0e0; font-size: 14px;
  }
  button { cursor: pointer; background: #0d7377; border: none; }
  button:hover { background: #14a085; }
  button:disabled { opacity: 0.4; cursor: not-allowed; }
  button.danger { background: #c0392b; }
  button.danger:hover { background: #e74c3c; }
  #deviceList { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 16px; }
  .dev-btn { background: #2a2a4e; }
  .dev-btn.active { background: #0d7377; }
  .dev-btn.synced { border-color: #f39c12; }
  .dev-btn.online { border-color: #27ae60; }
  #canvasWrap { position: relative; display: inline-block; max-width: 100%; }
  #video { display: none; max-width: 100%; border: 1px solid #444; background: #000; }
  canvas { display: block; max-width: 100%; border: 1px solid #444; }
  canvas.overVideo { position: absolute; inset: 0; width: 100%; height: 100%; background: transparent; border: none; z-index: 1; }
  #status { margin-top: 12px; font-size: 14px; min-height: 24px; padding: 10px 14px; border-radius: 6px; transition: all 0.3s; font-weight: 500; }
  #status.success { color: #2ecc71; background: rgba(46,204,113,0.18); border: 1px solid rgba(46,204,113,0.5); box-shadow: 0 0 12px rgba(46,204,113,0.3); }
  #status.error { color: #ff5e5e; background: rgba(231,76,60,0.18); border: 1px solid rgba(231,76,60,0.5); box-shadow: 0 0 12px rgba(231,76,60,0.3); }
  #status.info { color: #aaa; background: transparent; border: none; }
  #status.pending { color: #f1c40f; background: rgba(241,196,15,0.15); border: 1px solid rgba(241,196,15,0.4); }
  #status.success::before { content: '✓ '; font-weight: bold; }
  #status.error::before { content: '✗ '; font-weight: bold; }
  #status.pending::before { content: '⏳ '; }
  .hint { font-size: 12px; color: #888; margin-top: 8px; line-height: 1.6; }
  .coords { font-size: 13px; color: #8be9fd; margin-top: 8px; font-family: monospace; }
  .error { color: #e74c3c; }
  .ok { color: #27ae60; }
  label { font-size: 13px; color: #aaa; }
</style>
</head>
<body>

<h1>设备计数配置工具</h1>

<div class="nav" style="margin-bottom:12px;">
  <a href="/static/device-config.html">设备计数配置</a>
  <a href="/static/device-info.html">设备信息管理</a>
  <a href="/static/business-rules.html">业务规则配置</a>
</div>

<div class="row">
  <label>后端地址</label>
  <input id="baseUrl" value="http://localhost:8000" style="width:240px">
  <button onclick="doSync()">同步设备</button>
  <button onclick="loadDevices()">刷新列表</button>
</div>

<div id="deviceList"></div>

<div class="row">
  <label>类型</label>
  <select id="cameraType">
    <option value="">全部检测</option>
    <option value="vehicle">只检车</option>
    <option value="person">只检人</option>
  </select>
  <label>方向</label>
  <select id="countOnly">
    <option value="">双向计数</option>
    <option value="enter">只计进入</option>
    <option value="exit">只计离开</option>
  </select>
  <label>最大车辆数</label>
  <input id="maxVehicles" type="number" min="1" step="1" value="" style="width:70px" title="ROI 内车辆数≥此值 且 车流速度过低时判定车辆拥挤">
  <label>最大人数</label>
  <input id="maxPersons" type="number" min="1" step="1" value="" style="width:70px" title="ROI 内人数≥此值 且 人流速度过低时判定人流拥挤; 同时配置车辆和人流则加权综合">
  <button id="enableBtn" disabled onclick="doEnable()">启流计数</button>
  <button id="previewBtn" disabled onclick="togglePreview()">▶ 预览</button>
  <button id="clearBtn" disabled onclick="clearCanvas()">清除画线</button>
  <span style="width:1px;height:28px;background:#444;display:inline-block;margin:0 8px;"></span>
  <button id="roiModeBtn" onclick="toggleRoiMode()" style="background:#5a4a2e;">ROI 模式</button>
  <button id="clearRoiBtn" disabled onclick="clearRoi()" class="danger">清除 ROI</button>
</div>

<div id="canvasWrap">
  <video id="video" muted autoplay playsinline></video>
  <canvas id="canvas" width="960" height="540"></canvas>
</div>

<div id="status"></div>
<div class="coords" id="coords"></div>

<div class="hint">
  <b>计数线：</b>① 选择设备 -> 自动截帧 ② 在画面上点击两个点画计数线 ③ 再点一个点作为锚点（锚点所在侧=内侧=Enter方向）<br>
  <b>ROI 区域：</b>点击「ROI 模式」切换到多边形绘制，点击画面添加顶点（至少3个），右键/双击完成多边形，仅 ROI 内轨迹参与计数<br>
  画完后点「启流计数」提交配置并启动 AI 推理管道。
</div>

<script src="config.js"></script>
<script>
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
const statusEl = document.getElementById('status');
const coordsEl = document.getElementById('coords');

let baseUrl = '';
let currentDevice = null;
let img = null;
let clicks = []; // [{x, y}] 前两个=线端点, 第三个=锚点
let roiClicks = []; // [{x, y}] ROI 多边形顶点
let isRoiMode = false;

// 后端地址默认取 static/config.js 配置; 未配置则同源(页面由后端 /static 提供)
baseUrl = ((window.OPS_CONFIG && window.OPS_CONFIG.API_BASE) || window.location.origin).replace(/\/$/, '');
document.getElementById('baseUrl').value = baseUrl;

function api(path, options = {}) {
  return fetch(baseUrl + path, options).then(async r => {
    if (r.ok && r.headers.get('content-type')?.includes('image/')) return r;
    const text = await r.text();
    let body;
    try { body = JSON.parse(text); } catch { body = text; }
    if (!r.ok) throw new Error(typeof body === 'string' ? body : body.detail || r.statusText);
    return { ok: true, json: body };
  });
}

function setStatus(msg, cls = 'info') {
  statusEl.textContent = msg;
  statusEl.className = 'status ' + cls;
}

async function doSync() {
  baseUrl = document.getElementById('baseUrl').value;
  setStatus('正在同步设备...');
  try {
    const res = await api('/api/devices/sync', { method: 'POST' });
    setStatus(`同步完成: 新增 ${res.json.added}, 启动 ${res.json.started}, 停止 ${res.json.stopped}, 恢复 ${res.json.recovered}`, 'success');
    await loadDevices(true);
  } catch (e) {
    if (String(e.message).includes('WVP 同步未启用')) {
      setStatus('当前未启用 WVP (WVP_ENABLED=false)：同步按钮仅用于国标摄像头场景；测试流/直连流直接「手动注册」即可（mock 设备已在列表中）', 'info');
    } else {
      setStatus('同步失败: ' + e.message, 'error');
    }
  }
}

async function loadDevices(silent = false) {
  baseUrl = document.getElementById('baseUrl').value;
  if (!silent) setStatus('加载设备列表...');
  try {
    const res = await api('/api/devices');
    const devices = res.json;
    const list = document.getElementById('deviceList');
    list.innerHTML = '';
    if (!devices.length) { if (!silent) setStatus('暂无设备'); return; }
    devices.forEach(d => {
      const btn = document.createElement('button');
      btn.className = 'dev-btn ' + (d.status || '');
      btn.textContent = `${d.id} [${d.status || '?'}]`;
      if (d.status === 'synced' || d.status === 'online' || d.status === 'running' || d.status === 'registered') {
        btn.onclick = () => selectDevice(d);
      } else {
        btn.disabled = true;
      }
      list.appendChild(btn);
    });
    if (!silent) setStatus(`共 ${devices.length} 台设备，点击设备进行配置`);
  } catch (e) { if (!silent) setStatus('加载失败: ' + e.message, 'error'); }
}

async function selectDevice(d) {
  currentDevice = d;
  document.querySelectorAll('.dev-btn').forEach(b => b.classList.remove('active'));
  event.target.classList.add('active');
  clicks = [];
  roiClicks = [];
  isRoiMode = false;
  document.getElementById('roiModeBtn').textContent = 'ROI 模式';
  document.getElementById('roiModeBtn').style.background = '#5a4a2e';
  coordsEl.textContent = '';
  document.getElementById('enableBtn').disabled = true;
  document.getElementById('previewBtn').disabled = true;
  document.getElementById('clearBtn').disabled = true;
  document.getElementById('clearRoiBtn').disabled = true;
  if (previewOn) stopPreview();

  // 预填充类型和方向下拉框
  document.getElementById('cameraType').value = d.camera_type || '';
  document.getElementById('countOnly').value = d.count_only || '';
  // 预填充最大车辆数/最大人数 (拥挤判断阈值, 未配置留空)
  const maxV = d.max_vehicles;
  document.getElementById('maxVehicles').value = (maxV === undefined || maxV === null || maxV === '') ? '' : maxV;
  const maxP = d.max_persons;
  document.getElementById('maxPersons').value = (maxP === undefined || maxP === null || maxP === '') ? '' : maxP;

  setStatus(`正在截取 ${d.id} 画面... (约3-8秒)`);
  try {
    const res = await api(`/api/devices/${d.id}/snapshot`);
    const blob = await res.blob();
    const url = URL.createObjectURL(blob);
    img = new Image();
    img.onload = () => {
      canvas.width = img.naturalWidth;
      canvas.height = img.naturalHeight;
      // 显示设备已有 ROI
      if (d.roi_coords) {
        const parts = d.roi_coords.split(',').map(Number);
        if (parts.length >= 6 && parts.length % 2 === 0) {
          for (let i = 0; i < parts.length; i += 2) {
            roiClicks.push({ x: parts[i] * canvas.width, y: parts[i+1] * canvas.height });
          }
          document.getElementById('clearRoiBtn').disabled = false;
        }
      }
      redraw();
      const roiInfo = roiClicks.length ? ` ROI: ${roiClicks.length}顶点` : '';
      setStatus(`截帧成功 ${img.naturalWidth}x${img.naturalHeight}，请点击画面画线${roiInfo}`, 'success');
      document.getElementById('clearBtn').disabled = false;
      document.getElementById('previewBtn').disabled = false;
    };
    img.src = url;
  } catch (e) { setStatus('截帧失败: ' + e.message + ' (设备可能离线)', 'error'); }
}

canvas.addEventListener('click', (e) => {
  if (!img) return;
  const rect = canvas.getBoundingClientRect();
  const scaleX = canvas.width / rect.width;
  const scaleY = canvas.height / rect.height;
  const x = (e.clientX - rect.left) * scaleX;
  const y = (e.clientY - rect.top) * scaleY;

  if (isRoiMode) {
    // ROI 模式：添加多边形顶点
    roiClicks.push({ x, y });
    document.getElementById('clearRoiBtn').disabled = false;
    redraw();
    const parts = roiClicks.map(c => `${(c.x/canvas.width).toFixed(4)},${(c.y/canvas.height).toFixed(4)}`).join('  ');
    coordsEl.textContent = `ROI 顶点 (${roiClicks.length})：${parts}`;
    setStatus(`ROI 顶点 ${roiClicks.length}/3+，继续点击或右键/双击完成`, 'ok');
    if (roiClicks.length >= 3) {
      document.getElementById('enableBtn').disabled = clicks.length < 3;
    }
    return;
  }

  if (clicks.length >= 3) clicks = []; // 重新开始

  clicks.push({ x, y });
  redraw();

  if (clicks.length === 2) {
    coordsEl.textContent = `计数线: (${(clicks[0].x/canvas.width).toFixed(3)},${(clicks[0].y/canvas.height).toFixed(3)}) -> (${(clicks[1].x/canvas.width).toFixed(3)},${(clicks[1].y/canvas.height).toFixed(3)})  请再点一个锚点`;
  } else if (clicks.length === 3) {
    const line = `${(clicks[0].x/canvas.width).toFixed(4)},${(clicks[0].y/canvas.height).toFixed(4)},${(clicks[1].x/canvas.width).toFixed(4)},${(clicks[1].y/canvas.height).toFixed(4)}`;
    const anchor = `${(clicks[2].x/canvas.width).toFixed(4)},${(clicks[2].y/canvas.height).toFixed(4)}`;
    coordsEl.textContent = `计数线: ${line}  锚点: ${anchor}`;
    document.getElementById('enableBtn').disabled = roiClicks.length >= 3 ? false : false;
    setStatus('配置就绪，点「启流计数」提交', 'success');
  } else {
    coordsEl.textContent = `点 ${clicks.length}/3: (${(x/canvas.width).toFixed(3)}, ${(y/canvas.height).toFixed(3)})`;
  }
});

// 右键/双击完成 ROI 绘制
canvas.addEventListener('contextmenu', (e) => {
  e.preventDefault();
  if (isRoiMode && roiClicks.length >= 3) {
    finishRoi();
  }
});
canvas.addEventListener('dblclick', (e) => {
  if (isRoiMode && roiClicks.length >= 3) {
    e.preventDefault();
    finishRoi();
  }
});

function finishRoi() {
  isRoiMode = false;
  document.getElementById('roiModeBtn').textContent = 'ROI 模式';
  document.getElementById('roiModeBtn').style.background = '#5a4a2e';
  const parts = roiClicks.map(c => `${(c.x/canvas.width).toFixed(4)},${(c.y/canvas.height).toFixed(4)}`).join(' ');
  setStatus(`ROI 完成 (${roiClicks.length} 顶点): ${parts}`, 'success');
  document.getElementById('enableBtn').disabled = clicks.length < 3;
}

function redraw() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  if (img) ctx.drawImage(img, 0, 0); // 非预览时画截帧底图; 预览时 video 在底层播放

  // 绘制 ROI 多边形
  if (roiClicks.length >= 3) {
    ctx.beginPath();
    ctx.moveTo(roiClicks[0].x, roiClicks[0].y);
    for (let i = 1; i < roiClicks.length; i++) {
      ctx.lineTo(roiClicks[i].x, roiClicks[i].y);
    }
    ctx.closePath();
    ctx.fillStyle = 'rgba(0, 150, 255, 0.15)';
    ctx.fill();
    ctx.strokeStyle = '#0096ff';
    ctx.lineWidth = 2;
    ctx.setLineDash([6, 4]);
    ctx.stroke();
    ctx.setLineDash([]);
    // 顶点标记
    roiClicks.forEach((c, i) => {
      ctx.beginPath();
      ctx.arc(c.x, c.y, 5, 0, Math.PI * 2);
      ctx.fillStyle = '#0096ff';
      ctx.fill();
      // 顶点序号
      ctx.fillStyle = '#fff';
      ctx.font = '12px monospace';
      ctx.fillText(i + 1, c.x + 8, c.y - 4);
    });
  } else if (roiClicks.length > 0) {
    // 绘制中的 ROI 线段
    ctx.beginPath();
    ctx.moveTo(roiClicks[0].x, roiClicks[0].y);
    for (let i = 1; i < roiClicks.length; i++) {
      ctx.lineTo(roiClicks[i].x, roiClicks[i].y);
    }
    ctx.strokeStyle = '#0096ff';
    ctx.lineWidth = 2;
    ctx.setLineDash([6, 4]);
    ctx.stroke();
    ctx.setLineDash([]);
    roiClicks.forEach((c, i) => {
      ctx.beginPath();
      ctx.arc(c.x, c.y, 5, 0, Math.PI * 2);
      ctx.fillStyle = '#0096ff';
      ctx.fill();
    });
  }

  if (clicks.length >= 1) {
    // 画已点击的点
    clicks.forEach((c, i) => {
      ctx.beginPath();
      ctx.arc(c.x, c.y, 6, 0, Math.PI * 2);
      ctx.fillStyle = i < 2 ? '#00ff00' : '#ff0000';
      ctx.fill();
    });
    // 画线
    if (clicks.length >= 2) {
      ctx.beginPath();
      ctx.moveTo(clicks[0].x, clicks[0].y);
      ctx.lineTo(clicks[1].x, clicks[1].y);
      ctx.strokeStyle = '#00ff00';
      ctx.lineWidth = 3;
      ctx.stroke();
    }
    // 锚点连线（虚线）
    if (clicks.length >= 3) {
      ctx.beginPath();
      const midX = (clicks[0].x + clicks[1].x) / 2;
      const midY = (clicks[0].y + clicks[1].y) / 2;
      ctx.moveTo(midX, midY);
      ctx.lineTo(clicks[2].x, clicks[2].y);
      ctx.strokeStyle = '#ff0000';
      ctx.lineWidth = 2;
      ctx.setLineDash([8, 4]);
      ctx.stroke();
      ctx.setLineDash([]);
    }
  }
}

function clearCanvas() {
  clicks = [];
  coordsEl.textContent = '';
  document.getElementById('enableBtn').disabled = roiClicks.length < 3;
  redraw();
  setStatus('已清除计数线，请重新画线');
}

function toggleRoiMode() {
  isRoiMode = !isRoiMode;
  const btn = document.getElementById('roiModeBtn');
  if (isRoiMode) {
    btn.textContent = '退出 ROI';
    btn.style.background = '#c0392b';
    setStatus('ROI 模式：点击画面添加多边形顶点（至少3个），右键或双击完成');
  } else {
    btn.textContent = 'ROI 模式';
    btn.style.background = '#5a4a2e';
    if (roiClicks.length >= 3) {
      setStatus('ROI 已就绪', 'success');
    } else {
      setStatus('已退出 ROI 模式');
    }
  }
}

function clearRoi() {
  roiClicks = [];
  document.getElementById('clearRoiBtn').disabled = true;
  document.getElementById('enableBtn').disabled = clicks.length < 3;
  if (isRoiMode) toggleRoiMode();
  redraw();
  coordsEl.textContent = coordsEl.textContent.split('\n').filter(l => !l.includes('ROI')).join('\n');
  setStatus('已清除 ROI 区域');
}

// ---- 实时预览播放 (flv.js / hls.js 按协议动态加载) ----
const videoEl = document.getElementById('video');
let previewOn = false;
let previewPlayer = null;

function loadScript(src) {
  return new Promise((ok, fail) => {
    if (document.querySelector(`script[src="${src}"]`)) return ok();
    const s = document.createElement('script');
    s.src = src;
    s.onload = ok;
    s.onerror = () => fail(new Error('CDN 脚本加载失败(内网?): ' + src));
    document.head.appendChild(s);
  });
}

async function togglePreview() {
  if (previewOn) { stopPreview(); return; }
  if (!currentDevice) return;
  setStatus('正在获取播放地址...', 'pending');
  try {
    const res = await api(`/api/devices/${currentDevice.id}/play`);
    const { play_url, protocol } = res.json;
    setStatus(`正在启动播放 (${protocol.toUpperCase()})...`, 'pending');
    if (previewPlayer) { try { previewPlayer.destroy(); } catch (e) {} previewPlayer = null; }
    if (protocol === 'flv') {
      await loadScript('https://cdn.jsdelivr.net/npm/flv.js@1.6.2/dist/flv.min.js');
      previewPlayer = flvjs.createPlayer({ type: 'flv', url: play_url, isLive: true });
      previewPlayer.attachMediaElement(videoEl);
      previewPlayer.load();
    } else {
      await loadScript('https://cdn.jsdelivr.net/npm/hls.js@1.5.13/dist/hls.min.js');
      if (videoEl.canPlayType('application/vnd.apple.mpegurl')) {
        videoEl.src = play_url; // Safari 原生 HLS
      } else if (Hls.isSupported()) {
        previewPlayer = new Hls();
        previewPlayer.loadSource(play_url);
        previewPlayer.attachMedia(videoEl);
      } else {
        throw new Error('浏览器不支持 HLS 播放');
      }
    }
    await videoEl.play();
    previewOn = true;
    img = null; // 预览时 video 作底层, canvas 只叠加画线
    canvas.classList.add('overVideo');
    videoEl.style.display = 'block';
    videoEl.addEventListener('loadedmetadata', () => {
      canvas.width = videoEl.videoWidth;
      canvas.height = videoEl.videoHeight;
      redraw();
    }, { once: true });
    document.getElementById('previewBtn').textContent = '■ 停止预览';
    setStatus(`预览播放中 (${protocol.toUpperCase()}): ${play_url}`, 'success');
  } catch (e) { setStatus('预览失败: ' + e.message, 'error'); }
}

function stopPreview() {
  videoEl.pause();
  videoEl.removeAttribute('src');
  videoEl.load();
  videoEl.style.display = 'none';
  if (previewPlayer) { try { previewPlayer.destroy(); } catch (e) {} previewPlayer = null; }
  previewOn = false;
  canvas.classList.remove('overVideo');
  document.getElementById('previewBtn').textContent = '▶ 预览';
  setStatus('已停止预览');
}

async function doEnable() {
  if (!currentDevice || clicks.length < 3) return;
  const line = `${(clicks[0].x/canvas.width).toFixed(4)},${(clicks[0].y/canvas.height).toFixed(4)},${(clicks[1].x/canvas.width).toFixed(4)},${(clicks[1].y/canvas.height).toFixed(4)}`;
  const anchor = `${(clicks[2].x/canvas.width).toFixed(4)},${(clicks[2].y/canvas.height).toFixed(4)}`;
  const cameraType = document.getElementById('cameraType').value;
  const countOnly = document.getElementById('countOnly').value;
  const maxVehiclesRaw = document.getElementById('maxVehicles').value;
  const maxPersonsRaw = document.getElementById('maxPersons').value;

  setStatus('正在启流...', 'pending');
  const body = { line_coords: line, anchor_coords: anchor };
  if (cameraType) body.camera_type = cameraType;
  if (countOnly) body.count_only = countOnly;
  if (roiClicks.length >= 3) {
    body.roi_coords = roiClicks.map(c => `${(c.x/canvas.width).toFixed(4)},${(c.y/canvas.height).toFixed(4)}`).join(',');
  }
  // 最大车辆数 (车辆拥挤判断阈值): 填写正整数时提交, 留空则不开启
  if (maxVehiclesRaw !== '' && maxVehiclesRaw !== null) {
    const maxV = parseInt(maxVehiclesRaw, 10);
    if (!isNaN(maxV) && maxV > 0) body.max_vehicles = maxV;
  }
  // 最大人数 (人流拥挤判断阈值): 填写正整数时提交, 留空则不开启; 与最大车辆数同时配置则加权综合
  if (maxPersonsRaw !== '' && maxPersonsRaw !== null) {
    const maxP = parseInt(maxPersonsRaw, 10);
    if (!isNaN(maxP) && maxP > 0) body.max_persons = maxP;
  }

  try {
    const res = await api(`/api/devices/${currentDevice.id}/enable`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(body)
    });
    setStatus(`启流成功! 设备 ${currentDevice.id} 已上线，AI 开始计数`, 'success');
    await loadDevices(true);
  } catch (e) { setStatus('启流失败: ' + e.message, 'error'); }
}

// 初始加载
loadDevices();
</script>
</body>
</html>
