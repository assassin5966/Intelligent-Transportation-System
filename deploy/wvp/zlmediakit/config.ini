; ============================================================
; ZLMediaKit 流媒体引擎配置
; 作用: 收摄像头发来的 RTP 流 -> 重组 H.264 -> 转 HTTP-FLV 给 AI 拉流
; 关键: secret 和 mediaServerId 必须与 WVP application.yml 中的 media 配置一致
; ============================================================

[api]
; API 密钥 (WVP 通过此密钥调用 ZLMediaKit 的 REST API 控制流媒体)
; 必须与 WVP application-docker.yml 的 media.secret 一致 (默认 035c73f7-...)
secret=035c73f7-bb6b-4889-a715-d9eb2d1925cc

[general]
; 媒体服务器唯一ID, 必须与 WVP application.yml 的 media.id 一致
mediaServerId=FQ3TF8yT83wh5Wvz
; 流无人观看多久后关闭(毫秒). GB28181 点播需保持流不断, 设较大值
streamNoneReaderDelayMS=180000
; 是否启用虚拟主机 (关闭简化配置)
enableVhost=0

[http]
; HTTP 服务端口 (AI 通过 http://ip:80/flv?app=live&stream=xxx 拉流)
port=80
; HTTPS 端口 (本方案不用)
sslport=8443

[rtp_proxy]
; RTP 接收端口范围 (GB28181 摄像头由此范围发 RTP 流给 ZLMediaKit)
; 必须与 WVP application.yml 的 media.rtp.port-range 一致, 且 docker-compose 映射此范围
port_range=30000-30500
; RTP 流超时秒数 (超时未收到包则关闭流)
timeoutSec=30

[rtsp]
; RTSP 端口 (本方案主要用 FLV, 但保留)
port=554

[rtmp]
; RTMP 端口 (保留)
port=1935

[hook]
; 暂关闭 hook 回调 (WVP 可通过 API 主动查询状态, 减少配置复杂度)
enable=0
