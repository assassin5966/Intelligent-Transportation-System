; ============================================================
; ZLMediaKit 配置 - 上级平台 (upper)
; 关键: mediaServerId / api.secret 必须与 application.yml 的 media.id / media.secret 完全一致
;       [hook] 各项指向 WVP (http://wvp:18080/index/hook/*) -- WVP 依赖回调感知流变化
; ============================================================

[general]
mediaServerId=zlm-upper-02
enableAudio=0
wait_track_ready_ms=3000
mergeNoneMS=1

[api]
secret=zlm_upper_secret_2026
apiDebug=1
defaultSnap=www/logo.png
snapRoot=./www/snap/

[http]
port=80
allow_ip_range=
dirMenu=1
rootPath=./www
charSet=utf-8
keepAliveSecond=30
maxReqSize=40960
sendBufSize=65536

[rtsp]
port=554
authBasic=0
handshakeSecond=15
keepAliveSecond=15

[rtmp]
port=1935

[rtp]
; RTP 收包端口段 (需与 docker-compose 暴露的 udp 端口段一致)
port_range=30000-30500
audioMtuSize=1400
videoMtuSize=1400

[hls]
port=0
segDur=2
segNum=3

[hook]
enable=1
on_flow_report=
on_http_access=
on_play=http://wvp:18080/index/hook/on_play
on_publish=http://wvp:18080/index/hook/on_publish
on_stream_changed=http://wvp:18080/index/hook/on_stream_changed
on_stream_not_found=http://wvp:18080/index/hook/on_stream_not_found
on_stream_none_reader=http://wvp:18080/index/hook/on_stream_none_reader
on_server_started=http://wvp:18080/index/hook/on_server_started
on_server_keepalive=http://wvp:18080/index/hook/on_server_keepalive
on_rtp_server_timeout=http://wvp:18080/index/hook/on_rtp_server_timeout
alive_interval=30
retry=3
retry_delay=3
