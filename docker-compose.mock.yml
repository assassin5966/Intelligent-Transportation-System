# ============================================================
# Mock 模式 Docker Compose 覆盖配置
# 功能: 用 data/ 下的测试视频通过 RTSP 模拟视频流, 启动后端所有功能接口
# 用法: docker compose -f docker-compose.yml -f docker-compose.mock.yml up -d
# 停止: docker compose -f docker-compose.yml -f docker-compose.mock.yml down
# ============================================================

services:
  # ---------- 业务后端: Mock 模式关闭 WVP 同步 ----------
  # 主 docker-compose.yml 已包含 RTSP 推流服务 (rtsp-streamer-*)
  backend:
    environment:
      - WVP_ENABLED=false

  # ---------- RTSP 推流视频: 车辆/人流分别用含真实目标的识别视频 ----------
  # 主 compose 推车辆识别20s.mp4/人流识别20s.mp4; mock 环境曾统一用 test_50f.mp4,
  # 但该视频无越线目标导致计数恒为 0, 现恢复为真实识别视频.
  # 另: 本机 AI 单帧推理约 0.9s (CPU, 最高~1fps), 25fps 推流会让 MediaMTX 判定
  # reader 太慢并断开连接 -> AI 反复重连不出数据. 故 mock 推流降为 1fps 匹配 AI 处理能力.
  rtsp-streamer-vehicle:
    command: >
      ffmpeg -re -stream_loop -1 -i /data/video/车辆识别20s.mp4
      -c:v libx264 -preset ultrafast -tune zerolatency -r 1 -g 1
      -f rtsp -rtsp_transport tcp rtsp://rtsp-server:8554/vehicle

  rtsp-streamer-person:
    command: >
      ffmpeg -re -stream_loop -1 -i /data/video/人流识别20s.mp4
      -c:v libx264 -preset ultrafast -tune zerolatency -r 1 -g 1
      -f rtsp -rtsp_transport tcp rtsp://rtsp-server:8554/person