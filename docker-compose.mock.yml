# ============================================================
# Mock 模式 Docker Compose (测试依赖覆盖层)
# 功能: 将测试服务(MediaMTX RTSP + FFmpeg 推流 + 本地视频处理器)与
#       Mock 业务模式(后端关闭 WVP 同步)集中于此,
#       正式部署的 docker-compose.yml 不包含任何测试服务。
# 用法: bash scripts/mock_start.sh  (内部 -f docker-compose.yml -f docker-compose.mock.yml)
#       docker compose -f docker-compose.yml -f docker-compose.mock.yml up -d redis mysql rtsp-server ...
# 停止: bash scripts/mock_start.sh --down
# ============================================================

services:
  # ---------- 业务后端: Mock 模式关闭 WVP 同步 ----------
  backend:
    environment:
      - WVP_ENABLED=false

  # ---------- MediaMTX: RTSP 服务器 (测试用) ----------
  # 接收 FFmpeg 推流, AI 服务通过 RTSP 地址拉流
  rtsp-server:
    image: bluenviron/mediamtx:latest
    container_name: traffic-rtsp-server
    ports:
      - "8554:8554"    # RTSP
      - "8888:8888"    # HTTP (HLS 播放, 前端经 /play 接口拿此地址)
      # 1935 RTMP 已移除映射: 与 wvp 项目的 zlmediakit(1935) 冲突; 当前推流走 8554 RTSP 不需要 RTMP
    volumes:
      - ./data:/data/video:ro
      - ./configs/mediamtx.yml:/mediamtx.yml:ro   # 开启 HLS (默认关闭; 前端 /play 播放依赖)

  # ---------- RTSP 推流视频: 车辆/人流分别用含真实目标的识别视频 ----------
  # 本机 AI 单帧推理约 0.9s (CPU, 最高~1fps), 25fps 推流会让 MediaMTX 判定
  # reader 太慢并断开连接 -> AI 反复重连不出数据. 故 mock 推流降为 1fps 匹配 AI 处理能力.
  rtsp-streamer-vehicle:
    image: smart-city-platform:latest
    container_name: traffic-rtsp-streamer-vehicle
    depends_on:
      - rtsp-server
    volumes:
      - ./data:/data/video:ro
    environment:
      - PYTHONUNBUFFERED=1
    command: >
      ffmpeg -re -stream_loop -1 -i /data/video/车辆识别20s.mp4
      -c:v libx264 -preset ultrafast -tune zerolatency -r 1 -g 1
      -f rtsp -rtsp_transport tcp rtsp://rtsp-server:8554/vehicle

  rtsp-streamer-person:
    image: smart-city-platform:latest
    container_name: traffic-rtsp-streamer-person
    depends_on:
      - rtsp-server
    volumes:
      - ./data:/data/video:ro
    environment:
      - PYTHONUNBUFFERED=1
    command: >
      ffmpeg -re -stream_loop -1 -i /data/video/人流识别20s.mp4
      -c:v libx264 -preset ultrafast -tune zerolatency -r 1 -g 1
      -f rtsp -rtsp_transport tcp rtsp://rtsp-server:8554/person

  # ---------- 视频处理器 (本地测试用, video_processor.py) ----------
  ai-processor:
    image: smart-city-platform:latest
    container_name: traffic-ai-processor
    volumes:
      - ./output:/data/video:ro
      - ./output:/data/output
      - ./models:/app/models:ro
      - ./tool:/app/tool:ro
      - ./app:/app/app:ro
    environment:
      - PYTHONPATH=/app
    command: >
      python /app/tool/video_processor.py
      --video /data/video/test_50f.mp4
      --output /data/output
      --camera_id CAM001
      --frame_skip 5