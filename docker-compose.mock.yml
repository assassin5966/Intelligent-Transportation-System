# ============================================================
# Mock 模式 Docker Compose 覆盖配置
# 功能: 用 data/ 下的测试视频通过 RTSP 模拟视频流, 启动后端所有功能接口
# 用法: docker compose -f docker-compose.yml -f docker-compose.mock.yml up -d
# 停止: docker compose -f docker-compose.yml -f docker-compose.mock.yml down
# ============================================================

services:
  # ---------- 业务后端: Mock 模式关闭 WVP 同步 ----------
  # 主 docker-compose.yml 已包含 RTSP 推流服务 (rtsp-streamer-*)
  backend:
    environment:
      - WVP_ENABLED=false

  # ---------- RTSP 推流视频覆盖: 统一用 data/test_50f.mp4 (点位 mock) ----------
  # 主 compose 推车辆识别20s.mp4/人流识别20s.mp4; mock 环境共用 data/test_50f.mp4,
  # 这里覆盖推流命令, 两路点位共用同一测试视频.
  rtsp-streamer-vehicle:
    command: >
      ffmpeg -re -stream_loop -1 -i /data/video/test_50f.mp4
      -c:v libx264 -preset ultrafast -tune zerolatency
      -f rtsp -rtsp_transport tcp rtsp://rtsp-server:8554/vehicle

  rtsp-streamer-person:
    command: >
      ffmpeg -re -stream_loop -1 -i /data/video/test_50f.mp4
      -c:v libx264 -preset ultrafast -tune zerolatency
      -f rtsp -rtsp_transport tcp rtsp://rtsp-server:8554/person