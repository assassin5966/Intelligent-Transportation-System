# 警力分配初始配置 (区域 + 总警力)
#
# 加载时机: 后端启动时读取并写入 Redis (sc:police:regions / sc:police:total),
#           仅当 Redis 中尚无对应数据时写入, 不覆盖 API 动态配置
#           (POST /api/police/regions, POST /api/police/total).
# 修改: 改文件后重启后端生效 (仅对新增/空数据生效, 已有数据以 Redis 为准).
#
# 区域划分说明:
#   按 data/device_geo.json 中 25 个设备经纬度, 依城墙方位聚合为 4 个区域
#   (东-和阳门 / 南-永泰门 / 西-清远门 / 北-武定门), 中心坐标为设备归一化均值.
#   每区域 device_id 需填"系统实际注册的设备 ID" (该 ID 与设备名称不同,
#   由注册 POST /api/devices 或 WVP 同步生成); 留空则该区域在場人数恒为 0,
#   警力退化为均匀分配. 可通过页面/API 按需绑定.
#
# 字段说明:
#   regions[].id        区域标识 (唯一, 与 API 注册的 id 同规则)
#   regions[].name      区域名称 (前端展示)
#   regions[].longitude/latitude 区域实际中心经纬度 (设备经纬度均值, 前端地图标注用)
#   regions[].center_x/y 区域中心坐标 (归一化 0-1, 由 device_geo.json 聚类得出,
#                       调度计算移动距离用)
#   regions[].device_id 关联摄像头设备 ID (分配时读取该设备当前在场人数,
#                       必须指向真实人流摄像头, 否则该区域人数恒为 0)

total: 50

regions:
  - id: R1
    name: "东区-和阳门"
    longitude: 113.313418   # 区域实际中心经度 (设备经纬度均值, 前端地图标注用)
    latitude: 40.093323     # 区域实际中心纬度
    center_x: 0.926
    center_y: 0.500
    device_id: ""   # 可绑: GAJK-2648/GAJK-2649 (和阳南门), GAJK-2626/GAJK-2624 (和阳北门)

  - id: R2
    name: "南区-永泰门"
    longitude: 113.302310
    latitude: 40.084888
    center_x: 0.491
    center_y: 0.085
    device_id: ""   # 可绑: GAJK-4926/GAJK-4925 (永泰东门), GAJK-4984/GAJK-4983 (永泰西门)

  - id: R3
    name: "西区-清远门"
    longitude: 113.291307
    latitude: 40.094067
    center_x: 0.060
    center_y: 0.536
    device_id: ""   # 可绑: GAJK-3519/GAJK-3518 (清远南门), GAJK-3496/GAJK-3497 (清远北门)

  - id: R4
    name: "北区-武定门"
    longitude: 113.301705
    latitude: 40.102884
    center_x: 0.468
    center_y: 0.970
    device_id: ""   # 可绑: GAJK-3395/GAJK-3396/GAKK-821/GAKK-822 (武定西门), GAJK-4325/GAJK-4326/GAKK-0020 (武定东门)
