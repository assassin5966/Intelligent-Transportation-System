# ============================================================
# GPU 版覆盖文件 (NVIDIA CUDA 12.2 / amd64, 8x RTX 4090)
# 目标服务器: 23.45.1.115 (宿主机, 需先装 NVIDIA 驱动 + nvidia-container-toolkit)
#
# 只覆盖 ai 服务的镜像构建与 GPU 资源, 其余服务沿用 docker-compose.yml:
#   docker compose -f docker-compose.yml -f docker-compose.gpu.yml up -d --build
#
# 前提: 宿主机已装 NVIDIA 驱动 (R530+, 支持 CUDA 12.2) 与 nvidia-container-toolkit
# 验证: docker compose -f docker-compose.yml -f docker-compose.gpu.yml exec ai \
#         python -c "import torch; print(torch.cuda.device_count(), torch.cuda.get_device_name(0))"
# ============================================================

services:
  ai:
    build:
      context: .
      dockerfile: Dockerfile.gpu
    image: smart-city-platform:gpu
    # 8 卡 4090: 全部预留给该容器; 单进程默认 0 号卡,
    # 多卡分片可按实例拆分并配 CUDA_VISIBLE_DEVICES (见 Dockerfile.gpu 头注释)
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 8          # 固定 8 卡; 弹性场景可改 all
              capabilities: [gpu]
    environment:
      # CUDA 12.2 驱动向下兼容 cu121 轮子; 显存策略按需调整
      - PYTORCH_CUDA_ALLOC_CONF=expandable_segments:True
