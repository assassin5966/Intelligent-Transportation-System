# ============================================================
# 智慧古城车辆人流监管平台 - GPU 版容器编排 (NVIDIA CUDA 12.2 / amd64, 卡数自适应)
# 目标服务器: 10.10.10.11 (宿主机, 需先装 NVIDIA 驱动 + nvidia-container-toolkit)
#
# 本文件独立使用, 不与 docker-compose.yml 叠加:
#   docker compose -f docker-compose.gpu.yml up -d
#   bash scripts/start_all_gpu.sh
# 与 CPU 版 (docker-compose.yml) 的唯一区别: ai/backend 使用 GPU 镜像 smart-city-platform:gpu,
# 且 ai 挂载全部可见 GPU (count: all), 卡内引擎数由 INFER_SLOTS_PER_GPU=0 自适应.
#
# 前提: 宿主机已装 NVIDIA 驱动 (R530+, 支持 CUDA 12.2) 与 nvidia-container-toolkit
# 验证: docker compose -f docker-compose.gpu.yml exec ai \
#         python -c "import torch; print(torch.cuda.device_count(), torch.cuda.get_device_name(0))"
# ============================================================

# 固定项目名: 容器/卷/网名不再随目录名或 -p 参数漂移 (与 CPU 版同名, 同机不可同时运行)
name: dt

services:
  # ---------- AI 分析服务 (YOLO11/ByteTrack/越线计数) ----------
  ai:
    build:
      context: .
      dockerfile: Dockerfile.gpu
    image: smart-city-platform:gpu
    container_name: dt-ai
    restart: unless-stopped
    command: ["python", "-m", "app.ai.service"]
    ports:
      - "8001:8001"
    environment:
      - REDIS_URL=redis://redis:6379/0
      - BACKEND_URL=http://backend:8000
      - EVENT_OUTBOX_PATH=/app/event-outbox/events.sqlite3
      - EVENT_DELIVERY_PROTOCOL=${EVENT_DELIVERY_PROTOCOL:-legacy}
      - BUSINESS_TIMEZONE=${BUSINESS_TIMEZONE:-Asia/Shanghai}
      - TZ=${BUSINESS_TIMEZONE:-Asia/Shanghai}
      - PYTHONUNBUFFERED=1
      # CUDA 12.2 驱动向下兼容 cu121 轮子
      # 显存分配策略 expandable_segments 默认禁用: 与个别驱动/内核模块组合存在
      # "首次 CUDA 调用挂起"先例 (正是本次现场故障嫌疑项). 确认 GPU 首推正常后,
      # 如需降低显存碎片可恢复:
      #   - PYTORCH_CUDA_ALLOC_CONF=expandable_segments:True
      # - PYTORCH_CUDA_ALLOC_CONF=expandable_segments:True
      - PYTORCH_CUDA_ALLOC_CONF=max_split_size_mb:128  # 使用原生分配器防止碎片化
      - CUDA_MODULE_LOADING=LAZY
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility
      # 计数可观测性 (排查漏计/误计): 控制台日志级别 / 运行统计周期 / 逐事件明细
      # LOG_LEVEL=DEBUG 时 docker logs 可看到详细日志 (文件日志 logs/*.log 始终 DEBUG)
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - COUNT_STATS_INTERVAL=${COUNT_STATS_INTERVAL:-30}
      - COUNT_EVENT_LOG=${COUNT_EVENT_LOG:-false}
      # Mock 数据模拟 (.env.gpu MOCK_ENABLED=true 时 AI 不拉流, 由模拟器生成事件)
      - MOCK_ENABLED=${MOCK_ENABLED:-false}
      # GPU 批量推理: 每卡 1 个模型实例 + 批内多路 track (32 路 32 实例 -> 卡数实例).
      # INFER_MODE=legacy 可一键回退为旧的"每路独立实例"路径
      - INFER_MODE=${INFER_MODE:-gpu_batch}
      - INFER_GPU_DEVICES=${INFER_GPU_DEVICES:-}
      - INFER_ENGINES_PER_GPU=${INFER_ENGINES_PER_GPU:-1}
      # 每卡槽位: 0=按 INFER_CAPACITY 自适应 (ceil(路数/实际卡数)); >0 固定值
      - INFER_SLOTS_PER_GPU=${INFER_SLOTS_PER_GPU:-0}
      - INFER_CAPACITY=${INFER_CAPACITY:-32}
      - INFER_SLOTS_MAX=${INFER_SLOTS_MAX:-32}
      - INFER_IMGSZ=${INFER_IMGSZ:-960}
      - INFER_HALF=${INFER_HALF:-true}
      - INFER_BATCH_TIMEOUT_MS=${INFER_BATCH_TIMEOUT_MS:-80}
      - INFER_QUEUE_MAX_BATCHES=${INFER_QUEUE_MAX_BATCHES:-2}
      - INFER_MAX_QUEUE_AGE_S=${INFER_MAX_QUEUE_AGE_S:-2}
      # CPU 批量推理: auto 模式下 GPU 不可用/自检失败时自动转 cpu_batch (不降 legacy)
      - INFER_CPU_ENGINES=${INFER_CPU_ENGINES:-2}
      - INFER_CPU_THREADS=${INFER_CPU_THREADS:-0}
      # 解码侧采样: 按帧率节流 + 解码端降分辨率 (ffmpeg 后端在子进程内完成, 4K 流收益最大)
      - DECODE_BACKEND=${DECODE_BACKEND:-ffmpeg}
      - DECODE_MAX_FPS=${DECODE_MAX_FPS:-8}
      - DECODE_FPS_SAMPLING=${DECODE_FPS_SAMPLING:-interval}
      - DECODE_MAX_SHORT_SIDE=${DECODE_MAX_SHORT_SIDE:-540}
      - STREAM_STALL_TIMEOUT_S=${STREAM_STALL_TIMEOUT_S:-15}
      - CLOCK_JUMP_TOLERANCE_S=${CLOCK_JUMP_TOLERANCE_S:-2}
    volumes:
      - ./app:/app/app:cached
      - ./models:/app/models:cached
      - ./configs:/app/configs:cached
      # scripts/ 挂进容器: 便于容器内跑离线工具 (如 GPU 推理基准 zbny-bench-gpu-infer.py,
      # 依赖镜像内的 torch/CUDA). 注意会遮蔽镜像内的 /app/scripts, 宿主机目录须与此处一致
      - ./scripts:/app/scripts:cached
      - ./logs:/app/logs
      - event-outbox:/app/event-outbox
      - model-cache:/root/.cache
    depends_on:
      redis:
        condition: service_started
      # 等 backend 健康后再启 AI；越线事件持久化并在后端恢复后重试
      backend:
        condition: service_healthy
    # 挂共享网, 供 AI 按服务名访问外部 ZLM(zlmediakit) 拉 HTTP-FLV
    networks:
      - default
      - wvp-shared
    # 特权模式 (等价 docker run --privileged): 现场经验, 部分机器驱动/容器运行时组合
    # 下 nvidia 设备节点权限不足导致 CUDA 初始化失败, 特权模式绕开设备 cgroup 限制;
    # 内网隔离部署, 可接受. 已装 nvidia-container-toolkit 的标准环境可去掉
    privileged: true
    # 共享内存 8g (等价 docker run --shm-size=8g): 默认 64MB 太小,
    # 多进程组件 (如 DataLoader workers) 会因 /dev/shm 不足崩溃; 线程内推理非必需, 预留保险
    shm_size: "8g"
    ulimits:
      memlock:
        soft: -1      # 解除内存锁定限制
        hard: -1
      stack:
        soft: 67108864   # 扩大栈内存
        hard: 67108864
    ipc: host
    # 卡数自适应: count: all 挂载本机全部 GPU (8卡/4卡/2卡机器同一份编排直接跑,
    # 卡内引擎数由 INFER_SLOTS_PER_GPU=0 自适应); 固定 count: 8 在少卡机器上
    # 容器会因 GPU 设备数不足创建失败
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  # ---------- 业务后端 (FastAPI: 实时统计/告警/REST API/预测) ----------
  backend:
    image: smart-city-platform:gpu
    container_name: dt-backend
    restart: unless-stopped
    command: ["uvicorn", "app.backend.main:app", "--host", "0.0.0.0", "--port", "8000"]
    ports:
      - "18000:8000"  # 宿主8000被 wvp-zlm 的 ZLM WebRTC(rtc)端口占用, 宿主侧改18000; 容器内仍8000, 前端nginx经容器网访问不受影响
    environment:
      - REDIS_URL=redis://redis:6379/0
      - AI_SERVICE_URL=http://ai:8001
      - EVENT_LEDGER_ENABLED=${EVENT_LEDGER_ENABLED:-false}
      - BUSINESS_TIMEZONE=${BUSINESS_TIMEZONE:-Asia/Shanghai}
      - TZ=${BUSINESS_TIMEZONE:-Asia/Shanghai}
      - PYTHONUNBUFFERED=1
      # 解码侧采样参数透传: 业务规则页「检测层」卡片展示 AI 侧生效值 (与 ai 服务同源 .env.gpu)
      - DECODE_BACKEND=${DECODE_BACKEND:-ffmpeg}
      - DECODE_MAX_FPS=${DECODE_MAX_FPS:-8}
      - DECODE_MAX_SHORT_SIDE=${DECODE_MAX_SHORT_SIDE:-540}
      # WVP-GB28181 对接 (WVP/ZLM 已外部部署; 启用需 WVP_ENABLED=true 且 WVP_API_URL 指向外部 WVP)
      - WVP_ENABLED=${WVP_ENABLED:-false}
      - WVP_API_URL=${WVP_API_URL:-http://wvp:18080}
      - WVP_USERNAME=${WVP_USERNAME:-admin}
      - WVP_PASSWORD=${WVP_PASSWORD:-admin}
      - WVP_SYNC_INTERVAL=${WVP_SYNC_INTERVAL:-30}
      - WVP_PLAY_RETRY_MAX_S=${WVP_PLAY_RETRY_MAX_S:-120}
      - WVP_PLAY_PROTOCOL=${WVP_PLAY_PROTOCOL:-flv}
      - WVP_STREAM_SUB=${WVP_STREAM_SUB:-true}
      # 前端播放地址翻译 (/api/devices/glm-5.3_common/play); 空值走自动推导/原样返回
      - ZLM_PUBLIC_BASE=${ZLM_PUBLIC_BASE:-}
      # 内部取流(截帧/AI)走容器网内 ZLM 服务名: 服务器公网IP不在网卡上, 容器内访问 sdp-ip 不通
      - ZLM_INTERNAL_BASE=${ZLM_INTERNAL_BASE:-http://zlmediakit}
      - MEDIAMTX_PUBLIC_BASE=${MEDIAMTX_PUBLIC_BASE:-}
      # MySQL 长期归档 (小时级车流/人流量落库, 长期报表); MYSQL_ENABLED=false 则跳过
      - MYSQL_ENABLED=${MYSQL_ENABLED:-true}
      - MYSQL_HOST=${MYSQL_HOST:-mysql}
      - MYSQL_PORT=${MYSQL_PORT:-3306}
      - MYSQL_USER=${MYSQL_USER:-root}
      - MYSQL_PASSWORD=${MYSQL_PASSWORD:-root123456}
      - MYSQL_DATABASE=${MYSQL_DATABASE:-dt_stats}
      # Mock 互斥保护 (main.py lifespan: mock 开启时强制关闭 WVP 同步)
      - MOCK_ENABLED=${MOCK_ENABLED:-false}
    volumes:
      - ./app:/app/app:cached
      - ./models:/app/models:cached
      - ./configs:/app/configs:cached
      - ./static:/app/static:cached
      - ./data:/app/data:cached
      - ./scripts:/app/scripts:ro
      - event-outbox:/app/event-outbox:ro
      - ./logs:/app/logs
    # 健康检查: 供 ai 的 depends_on condition=service_healthy 使用
    # (镜像内无 curl, 用 python 标准库探测 /health)
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health', timeout=3).status==200 else 1)"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    depends_on:
      redis:
        condition: service_started
      mysql:
        condition: service_healthy  # 等 MySQL 真正可连接, 否则启动建表失败
    # 挂共享网, 供 backend 按服务名访问外部 WVP(wvp:18080)
    networks:
      - default
      - wvp-shared

  # ---------- MySQL: 长期归档 (小时级车流/人流量报表) ----------
  mysql:
    image: mysql:8.0
    container_name: dt-mysql
    restart: unless-stopped
    environment:
      - MYSQL_ROOT_PASSWORD=root123456
      - MYSQL_DATABASE=dt_stats
      - TZ=Asia/Shanghai
    command: >
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
    # 宿主机映射 3307 (宿主 3306 常被本机 MySQL 占用); 容器内仍 3306, 后端经容器内网 mysql:3306 连接
    ports:
      - "3307:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    # 健康检查: 供 backend depends_on condition=service_healthy 使用
    # (MySQL 首次初始化需 10~30s; 不等健康则后端启动时建表会失败 -> device_info 表缺失)
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-p$$MYSQL_ROOT_PASSWORD"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  # ---------- Redis: 实时状态 (当前车辆/人员数量、告警、设备配置) ----------
  redis:
    image: redis:7-alpine
    container_name: dt-redis
    restart: unless-stopped
    # 后端应答前同步 AOF；去重账本禁止被内存淘汰（故障时返回错误，队列保留待重试）。
    command: ["redis-server", "--appendonly", "yes", "--appendfsync", "always", "--maxmemory-policy", "noeviction"]
    ports:
      - "16379:6379"
    volumes:
      - redis-data:/data

  # ---------- 大屏前端 (Vue3 + Vite, nginx 托管 + 反代后端 API/WS) ----------
  # 离线部署用【官方 nginx 基础镜像】+ 宿主机挂载, 不 build、不打进镜像:
  #   - 前端产物 dist  : 挂载宿主机 ./map-marking-system-vue/dist -> nginx 的 /usr/share/nginx/html
  #   - 瓦片 tiles     : 挂载宿主机 ./map-marking-system-vue/public/tiles -> nginx 的 /var/www/tiles
  # 替换 dist / 瓦片只需改宿主机目录, 无需重建镜像; 是本机先 npm run build 生成的 dist。
  # 访问: http://localhost:5173  (nginx 内 80, 宿主机映射 5173 与 dev 端口一致)
  # 仅改 nginx.conf / dist / 瓦片: 宿主机改后 docker exec dt-frontend nginx -s reload
  frontend:
    image: nginx:1.27-alpine
    container_name: dt-frontend
    restart: unless-stopped
    ports:
      - "5173:80"
    volumes:
      - ./map-marking-system-vue/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./map-marking-system-vue/dist:/usr/share/nginx/html:ro
      - ./map-marking-system-vue/public/tiles:/var/www/tiles:ro
    depends_on:
      - backend

volumes:
  event-outbox:
  redis-data:
  model-cache:
  mysql-data:

networks:
  default:
    name: dt_default
  # 引用 setting/ 创建的共享网络(先启动 setting 再启动本项目)
  wvp-shared:
    external: true
    name: wvp-shared
