# 内网瓦片服务器 Nginx 配置
# 用法: 将 download_tiles.py 下载的瓦片目录软链到 /var/www/tiles，
#       然后 include 此文件到 nginx.conf 的 http 块。
#
# 验证:
#   curl http://<内网IP>:8080/tiles/15/13589/23456.png
#
# 前端配置:
#   VITE_TILE_URL=http://<内网IP>:8080/tiles/{z}/{x}/{y}.png

server {
    listen 8080;
    server_name _;

    # 瓦片静态文件
    location /tiles/ {
        alias /var/www/tiles/;
        # 标准瓦片缓存策略：瓦片不变，长期缓存
        expires 30d;
        add_header Cache-Control "public, immutable";
        # 允许跨域（前端可能不同源）
        add_header Access-Control-Allow-Origin "*";

        # 如果瓦片文件不存在，返回 204 No Content（避免 404 弹窗，地图保持空白）
        error_page 404 = @empty;
    }

    # 瓦片缺失时返回 1x1 透明 PNG
    location @empty {
        add_header Access-Control-Allow-Origin "*";
        # 1x1 透明 PNG 的 base64
        default_type image/png;
        return 200 'iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAYAAAAfFcSJAAAAC0lEQVQI12NgAAIABQABNjN9GQAAAAlwSFlzAAAWJQAAFiUBSVIk8AAAAA0lEQVQI12P4z8BQDwAEgAF/QualFQAAAABJRU5ErkJggg==';
        add_header Content-Encoding identity;
    }

    # 健康检查
    location /health {
        access_log off;
        return 200 "OK\n";
    }

    # 禁止访问瓦片目录外的路径
    location / {
        return 403;
    }
}