# 智慧交管大屏前端 nginx 配置
# 前端为纯 SPA (Vue3 + Vite): 静态资源直出, /api /static /ws 反向代理到后端容器.
# 内网离线部署：所有依赖通过 npm 包构建打包，无需代理外网 CDN.
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_min_length 1k;
    gzip_types text/plain text/css application/javascript application/json application/xml image/svg+xml;

    # 业务后端 REST (设备/统计/告警/预测/警力/事件/运维页)
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # 后端静态运维页 (device-config.html / device-info.html / business-rules.html)
    location /static/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # 实时 WebSocket (/ws)
    location /ws {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # 内网离线地图瓦片（宿主机挂载至 /var/www/tiles 静态服务；替换瓦片直接改宿主目录即可）
    location /tiles/ {
        alias /var/www/tiles/;
        expires 30d;
        add_header Cache-Control "public, immutable";
        add_header Access-Control-Allow-Origin "*";
        # 瓦片缺失时返回 1x1 透明 PNG（避免 404 弹窗）
        error_page 404 = @empty_tile;
    }
    location @empty_tile {
        add_header Access-Control-Allow-Origin "*";
        default_type image/png;
        return 200 'iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAYAAAAfFcSJAAAAC0lEQVQI12NgAAIABQABNjN9GQAAAAlwSFlzAAAWJQAAFiUBSVIk8AAAAA0lEQVQI12P4z8BQDwAEgAF/QualFQAAAABJRU5ErkJggg==';
    }

    # SPA history 路由回退
    location / {
        try_files $uri $uri/ /index.html;
    }
}
