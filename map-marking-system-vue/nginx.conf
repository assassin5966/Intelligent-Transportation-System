# 智慧交管大屏前端 nginx 配置
# 前端为纯 SPA (Vue3 + Vite): 静态资源直出, /api /static /ws 反向代理到后端容器.
# 内网离线部署：所有依赖通过 npm 包构建打包，无需代理外网 CDN.
server {
    listen 80;
    server_name _;

    # Docker 内置 DNS: 动态解析 backend 容器 IP (容器重建后 IP 会变,
    # 静态 proxy_pass 只在启动时解析一次会拿到失效 IP 导致 502)
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $backend_upstream http://backend:8000;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_min_length 1k;
    gzip_types text/plain text/css application/javascript application/json application/xml image/svg+xml;

    # 业务后端 REST (设备/统计/告警/预测/警力/事件/运维页)
    location /api/ {
        proxy_pass $backend_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # 后端静态运维页 (device-config.html / device-info.html / business-rules.html)
    location /static/ {
        proxy_pass $backend_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # 实时 WebSocket (/ws)
    location /ws {
        proxy_pass $backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # 内网离线地图瓦片
    #   优先读宿主机挂载目录 /var/www/tiles（替换瓦片直接改宿主目录即可）；
    #   未挂载时自动回退到镜像内构建产物 /usr/share/nginx/html/tiles（build 时 public/tiles 已打包）。
    location /tiles/ {
        root /var/www;
        try_files $uri @bundled_tiles;
        expires 30d;
        add_header Cache-Control "public, immutable";
        add_header Access-Control-Allow-Origin "*";
    }
    # 回退：使用 dist 内自带的瓦片
    location @bundled_tiles {
        root /usr/share/nginx/html;
        try_files $uri =404;
        expires 30d;
        add_header Cache-Control "public, immutable";
        add_header Access-Control-Allow-Origin "*";
    }
    # 瓦片缺失时返回 1x1 透明 PNG（避免破图白块；容器底色由 CSS 控制，深浅主题自适应）
    location @empty_tile {
        add_header Access-Control-Allow-Origin "*";
        default_type image/png;
        return 200 'iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAYAAAAfFcSJAAAAC0lEQVQI12NgAAIABQABNjN9GQAAAAlwSFlzAAAWJQAAFiUBSVIk8AAAAA0lEQVQI12P4z8BQDwAEgAF/QualFQAAAABJRU5ErkJggg==';
    }

    # SPA history 路由回退
    location / {
        try_files $uri $uri/ /index.html;
    }
}
